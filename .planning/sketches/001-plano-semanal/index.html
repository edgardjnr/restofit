<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 001 · Plano semanal</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased}
body{padding:64px 16px 40px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button,.tap{transition:all .15s ease}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- barra de variantes (fora do app) ---------- */
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#1a1a1a;border-bottom:1px solid #333;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:system-ui;font-size:13px;color:#ddd}
.variant-tab,.state-btn{padding:6px 12px;border-radius:8px;background:#2a2a2a;color:#ccc}
.variant-tab:hover,.state-btn:hover{background:#383838}
.variant-tab.active{background:#C2410C;color:#fff}
.state-btn.active{outline:1px solid #C2410C;color:#fff}
#variant-nav .sep{flex:1}
#variant-nav .lbl{color:#777;font-size:12px}

/* ---------- moldura do app ---------- */
#stage{display:flex;justify-content:center}
#phone{width:390px;max-width:100%;height:844px;background:var(--color-bg);border-radius:36px;border:1px solid #333;overflow:hidden;position:relative;container-type:inline-size;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:width .25s var(--ease),height .25s var(--ease)}
#phone.tablet{width:768px;height:1024px;border-radius:24px}
#phone.desktop{width:1280px;height:860px;border-radius:12px}
#screen{position:absolute;inset:0 0 83px;overflow-y:auto;padding:14px 16px 28px}
#screen::-webkit-scrollbar{width:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;background:color-mix(in srgb,var(--color-surface) 92%,transparent);backdrop-filter:blur(20px);border-top:.5px solid var(--color-border);display:flex;justify-content:space-around;padding-top:8px}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--color-text-muted);width:64px}
.tabbar div.on{color:var(--color-primary)}
.tabbar svg{width:24px;height:24px}
.inner{max-width:1080px;margin:0 auto}

/* ---------- peças compartilhadas ---------- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:18px 0 14px}
.hdr h1{font-size:var(--text-3xl);font-weight:800;letter-spacing:-.02em}
.hdr .sub{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:2px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--color-surface);display:grid;place-items:center;color:var(--color-primary)}
.iconbtn:hover{background:var(--color-surface-2)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.sm{width:28px;height:28px}
.iconbtn.sm svg{width:14px;height:14px}
.iconbtn:disabled{opacity:.3;pointer-events:none}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px}
.sec h4{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)}
.sec .meta{font-size:var(--text-xs);color:var(--color-text-muted)}
.card{background:var(--color-surface);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:8px 14px;font-weight:600;font-size:var(--text-sm)}
.btn svg{width:15px;height:15px}
.btn.fill{background:var(--color-primary);color:var(--color-on-primary)}
.btn.fill:hover{background:var(--color-primary-hover)}
.btn.tint{background:var(--color-primary-soft);color:var(--color-primary)}
.btn.tint:hover{background:var(--color-primary-line)}
.btn.ghost{color:var(--color-primary)}
.btn.ghost:hover{background:var(--color-primary-soft)}
.btn.block{width:100%;padding:11px}
.gly{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.gly svg{width:18px;height:18px}
.dim{color:var(--color-text-muted)}
.faint{color:var(--color-text-dim)}
.small{font-size:var(--text-xs)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mbar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1.5px;background:var(--color-surface-2)}
.mbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.legend span{font-size:10.5px;color:var(--color-text-muted);display:flex;align-items:center;gap:4px}
.legend b{width:7px;height:7px;border-radius:2px;display:inline-block}

.coach{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px;color:#fff;
  background:linear-gradient(135deg,#C2410C 0%,#9A3412 55%,#6b2310 100%);
  box-shadow:0 8px 24px color-mix(in srgb,#C2410C 35%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.coach::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%);transform:translateX(-100%);animation:coach-shine 4.5s ease-in-out infinite}
@keyframes coach-shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.coach:hover{filter:brightness(1.08);transform:translateY(-1px)}
.coach .gly{background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:12px}
.coach .gly svg{width:20px;height:20px}
.coach b{font-size:var(--text-base);font-weight:700;display:flex;align-items:center;gap:6px}
.coach .ai{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;background:#fff;color:#9A3412;border-radius:5px;padding:2px 5px}
.coach .grow > span{font-size:var(--text-xs);color:rgba(255,255,255,.82);display:block;margin-top:2px}
.coach .cv{color:rgba(255,255,255,.8);width:16px;flex:none}
.coach .cv svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.coach::after{animation:none}}

/* volume semanal com faixa-alvo */
.vol{padding:12px 14px}
.vol-row{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:10px;padding:5px 0}
.vol-row .nm{font-size:var(--text-sm)}
.vol-track{position:relative;height:8px;border-radius:4px;background:var(--color-surface-2)}
.vol-band{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--color-text-dim);border-right:1px dashed var(--color-text-dim);background:color-mix(in srgb,var(--color-text) 4%,transparent)}
.vol-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .3s var(--ease)}
.vol-row .n{font-size:var(--text-sm);text-align:right}
.vol-row .n.low{color:var(--color-danger)}
.vol-foot{font-size:10.5px;color:var(--color-text-dim);margin-top:6px}

.empty{text-align:center;padding:48px 20px;color:var(--color-text-muted);font-size:var(--text-sm)}
.empty .ico{width:56px;height:56px;border-radius:16px;background:var(--color-surface);display:grid;place-items:center;margin:0 auto 14px;color:var(--color-primary)}
.empty .ico svg{width:26px;height:26px}
.empty .btn{margin-top:16px}

/* ---------- sheet + toast ---------- */
#sheet-root{position:absolute;inset:0;pointer-events:none;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--color-bg-el);border-radius:18px 18px 0 0;padding:8px 16px 28px;transform:translateY(100%);transition:transform .28s var(--ease);max-height:80%;overflow-y:auto}
@container (min-width:700px){.sheet{left:50%;width:440px;margin-left:-220px;bottom:40px;border-radius:18px}}
#sheet-root.open{pointer-events:auto}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--color-surface-3);margin:0 auto 12px}
.sheet h3{font-size:var(--text-lg);font-weight:700}
.sheet .shsub{font-size:var(--text-sm);color:var(--color-text-muted);margin:2px 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;background:var(--color-surface);border-radius:12px;margin-bottom:6px}
.opt:hover{background:var(--color-surface-2)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--color-text-dim);display:grid;place-items:center;flex:none}
.check.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.check svg{width:13px;height:13px}
.opt.danger{color:var(--color-danger)}
.exl{background:var(--color-surface);border-radius:12px;overflow:hidden}
.exl .e{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:.5px solid var(--color-border-soft);font-size:var(--text-sm)}
.exl .e:first-child{border-top:0}
.exl .e .i{font-size:var(--text-xs);color:var(--color-text-dim)}
.exl .e .sr{font-size:var(--text-xs);color:var(--color-text-muted)}
.exl .e .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
#toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--color-surface-3);color:var(--color-text);padding:9px 16px;border-radius:20px;font-size:var(--text-sm);opacity:0;transition:all .22s var(--ease);pointer-events:none;z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   VARIANTE A — faixa da semana + cards densos
   ========================================================= */
.A-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.A-day{background:var(--color-surface);border-radius:12px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:92px;position:relative}
.A-day:hover{background:var(--color-surface-2)}
.A-day .dn{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted)}
.A-day.today{box-shadow:inset 0 0 0 1.5px var(--color-primary)}
.A-day.today .dn{color:var(--color-primary)}
.A-day .pills{display:flex;flex-direction:column;gap:3px;width:100%;padding:0 4px}
.A-day .pill{font-size:10px;font-weight:700;border-radius:5px;padding:3px 0;text-align:center;color:#fff;white-space:nowrap;overflow:hidden}
.A-day .rest{font-size:10px;color:var(--color-text-dim);margin-top:auto;margin-bottom:auto}
.A-day .ns{margin-top:auto;font-size:10px;color:var(--color-text-muted)}
.A-kpis{display:flex;gap:14px;margin-top:10px;font-size:var(--text-xs);color:var(--color-text-muted)}
.A-kpis b{color:var(--color-text);font-size:var(--text-sm);font-family:var(--font-mono);margin-right:3px}
.A-card{padding:12px 14px;margin-bottom:8px;cursor:pointer}
.A-card:hover{background:color-mix(in srgb,var(--color-surface) 80%,var(--color-surface-2))}
.A-card .nm{font-weight:650;font-size:var(--text-base)}
.A-card .st{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:1px}
.A-card .st b{color:var(--color-text);font-family:var(--font-mono);font-weight:600}
.A-days{display:flex;gap:3px;flex:none}
.A-days span{font-size:10px;font-weight:700;padding:3px 6px;border-radius:6px;background:var(--color-surface-2);color:var(--color-text-dim)}
.A-days span.on{background:var(--color-primary-soft);color:var(--color-primary)}
.A-card .mbar{margin-top:10px}
.A-more{display:none;margin-top:10px}
.A-card.open .A-more{display:block}
.A-card .chev{transition:transform .2s var(--ease);color:var(--color-text-dim)}
.A-card.open .chev{transform:rotate(90deg)}
.A-card .chev svg{width:14px;height:14px}
.A-acts{display:flex;gap:6px;margin-top:10px}
.A-acts .btn{flex:1}
@container (min-width:900px){
  .A-cols{display:grid;grid-template-columns:420px 1fr;gap:28px;align-items:start}
  .A-cols > div:first-child{position:sticky;top:0}
}

/* =========================================================
   VARIANTE B — matriz rotina × dia
   ========================================================= */
.B-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.B-kpi{background:var(--color-surface);border-radius:12px;padding:10px 12px}
.B-kpi .v{font-family:var(--font-mono);font-size:var(--text-xl);font-weight:700}
.B-kpi .v small{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:500}
.B-kpi .l{font-size:10.5px;color:var(--color-text-muted);margin-top:2px}
.B-mx{padding:4px 0;overflow-x:auto}
.B-mx table{width:100%;border-collapse:collapse}
.B-mx th{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);padding:8px 0 6px;text-align:center}
.B-mx th.today{color:var(--color-primary)}
.B-mx th:first-child{text-align:left;padding-left:12px}
.B-mx td{border-top:.5px solid var(--color-border-soft);text-align:center;padding:0}
.B-mx td.rn{text-align:left;padding:8px 6px 8px 12px;cursor:pointer;max-width:140px}
.B-mx td.rn:hover .nm{color:var(--color-primary)}
.B-mx .nm{font-size:var(--text-sm);font-weight:600;display:flex;align-items:center;gap:6px}
.B-mx .nm i{width:8px;height:8px;border-radius:50%;flex:none}
.B-mx .ss{font-size:10.5px;color:var(--color-text-muted);margin-left:14px}
.B-cell{width:26px;height:26px;border-radius:8px;border:1.5px dashed var(--color-surface-3);display:inline-grid;place-items:center;margin:4px 0}
.B-cell:hover{border-color:var(--color-text-dim);background:var(--color-surface-2)}
.B-cell.on{border:0;color:#fff}
.B-cell svg{width:13px;height:13px}
.B-mx tfoot td{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-muted);padding:8px 0;font-weight:600}
.B-mx tfoot td:first-child{text-align:left;padding-left:12px;font-family:var(--font-sans);font-weight:500}
.B-mx tfoot td.hi{color:var(--color-text)}
.B-add{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:.5px solid var(--color-border-soft);color:var(--color-primary);font-size:var(--text-sm);font-weight:600;width:100%}
.B-add:hover{background:var(--color-surface-2)}
.B-add svg{width:15px;height:15px}
.B-hint{font-size:10.5px;color:var(--color-text-dim);margin-top:6px;padding-left:2px}
@container (min-width:900px){
  .B-cols{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
  .B-kpis{grid-template-columns:repeat(3,1fr)}
}

/* =========================================================
   VARIANTE C — cards grandes estilo Hevy
   ========================================================= */
.C-week{display:flex;justify-content:space-between;background:var(--color-surface);border-radius:14px;padding:10px 12px}
.C-wd{display:flex;flex-direction:column;align-items:center;gap:5px;width:36px}
.C-wd .dn{font-size:10px;font-weight:700;color:var(--color-text-muted)}
.C-wd .dt{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--color-surface-2)}
.C-wd .dt.rest{color:var(--color-text-dim);font-weight:500}
.C-wd .dt.multi{font-size:10px}
.C-wd.today .dn{color:var(--color-primary)}
.C-wd.today .dt{box-shadow:0 0 0 2px var(--color-bg),0 0 0 3.5px var(--color-primary)}
.C-top{display:flex;gap:8px;margin-top:12px}
.C-top .btn{flex:1;padding:11px}
.C-card{padding:14px;margin-bottom:10px}
.C-card .t{display:flex;align-items:flex-start;gap:10px}
.C-card .nm{font-size:var(--text-lg);font-weight:700}
.C-card .pv{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.C-stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.C-stats span{font-size:11px;background:var(--color-surface-2);border-radius:6px;padding:3px 8px;color:var(--color-text-muted)}
.C-stats b{color:var(--color-text);font-family:var(--font-mono)}
.C-dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.C-dp{height:30px;border-radius:8px;font-size:11px;font-weight:700;background:var(--color-surface-2);color:var(--color-text-dim)}
.C-dp:hover{color:var(--color-text)}
.C-dp.on{color:#fff}
.C-card .btn.fill{margin-top:12px}
@container (min-width:700px){
  .C-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .C-grid .C-card{margin:0}
}

/* =========================================================
   RODADA 2 — peças simples compartilhadas
   ========================================================= */
.lst{background:var(--color-surface);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:.5px solid var(--color-border-soft);min-height:52px}
.li:first-child{border-top:0}
.li:hover{background:var(--color-surface-2)}
.li .t1{font-size:var(--text-base);font-weight:600}
.li .t2{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:1px}
.li .cv{color:var(--color-text-dim);width:14px;flex:none}
.li .cv svg{width:14px;height:14px}
.sgly{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--color-primary-soft);color:var(--color-primary)}
.sgly svg{width:16px;height:16px}
.sumline{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:8px;padding-left:2px}
.sumline b{color:var(--color-text);font-family:var(--font-mono);font-weight:600}

/* D — lista limpa */
.D-day{display:grid;grid-template-columns:44px 1fr 14px;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-top:.5px solid var(--color-border-soft)}
.D-day:first-child{border-top:0}
.D-day:hover{background:var(--color-surface-2)}
.D-day .dn{font-size:var(--text-sm);font-weight:700;color:var(--color-text-muted)}
.D-day.today .dn{color:var(--color-primary)}
.D-day .rn{font-size:var(--text-base);font-weight:600}
.D-day .rn.rest{font-weight:400;color:var(--color-text-dim)}
.D-day .cv{color:var(--color-text-dim)}
.D-day .cv svg{width:14px;height:14px}
@container (min-width:900px){.D-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}}

/* E — próximo treino + faixa */
.E-next{background:var(--color-surface);border-radius:16px;padding:14px}
.E-next .k{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--color-primary)}
.E-next .n{font-size:var(--text-xl);font-weight:750;margin-top:4px}
.E-next .m{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:2px}
.E-next .btn{margin-top:12px}
.E-strip{display:flex;justify-content:space-between;margin-top:12px;padding:0 4px}
.E-d{display:flex;flex-direction:column;align-items:center;gap:6px;width:38px;padding:4px 0;border-radius:10px}
.E-d:hover{background:var(--color-surface)}
.E-d .dn{font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted)}
.E-d .dot{width:8px;height:8px;border-radius:50%;background:var(--color-surface-3)}
.E-d.on .dot{background:var(--color-primary)}
.E-d.today .dn{color:var(--color-text);font-weight:800}
.E-d.today{background:var(--color-surface)}
.E-tag{font-size:var(--text-xs);color:var(--color-text-muted);flex:none}
.E-tag.on{color:var(--color-primary);font-weight:600}
/* cabeçalhos das duas colunas com a mesma altura: os cards começam na mesma linha */
.E-cols .sec{min-height:34px}
@container (min-width:900px){.E-cols{display:grid;grid-template-columns:380px 1fr;gap:28px;align-items:start}}

/* F — só rotinas */
.F-row{padding:12px 14px;border-top:.5px solid var(--color-border-soft)}
.F-row:first-child{border-top:0}
.F-top{display:flex;align-items:center;gap:12px;cursor:pointer}
.F-top:hover .t1{color:var(--color-primary)}
.F-days{display:flex;gap:4px;margin-top:10px;padding-left:42px}
.F-dp{flex:1;height:26px;border-radius:7px;font-size:11px;font-weight:700;background:var(--color-surface-2);color:var(--color-text-dim)}
.F-dp:hover{color:var(--color-text)}
.F-dp.on{background:var(--color-primary);color:var(--color-on-primary)}
.F-dp.today{box-shadow:inset 0 0 0 1.5px var(--color-primary-line)}
.F-new{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border-top:.5px solid var(--color-border-soft);color:var(--color-primary);font-weight:600;font-size:var(--text-sm)}
.F-new:hover{background:var(--color-surface-2)}
.F-new svg{width:16px;height:16px}
@container (min-width:900px){.F-wrap{max-width:560px}}

/* ---------- anotação ---------- */
body.annot #screen *:hover{outline:1px dashed #0af}
#annot-tip{position:fixed;z-index:10000;background:#000;color:#0cf;font:11px ui-monospace,monospace;padding:4px 7px;border-radius:5px;pointer-events:none;display:none;white-space:pre}
</style>
</head>
<body>

<div id="variant-nav">
  <span class="lbl">Rodada 2 (simples):</span>
  <button class="variant-tab active" data-v="d">D: Lista limpa</button>
  <button class="variant-tab" data-v="e">E: Próximo treino + faixa ★ Aprovada</button>
  <button class="variant-tab" data-v="f">F: Só rotinas</button>
  <span class="lbl" style="margin-left:10px">Rodada 1:</span>
  <button class="variant-tab" data-v="a">A</button>
  <button class="variant-tab" data-v="b">B</button>
  <button class="variant-tab" data-v="c">C</button>
  <span class="sep"></span>
  <span class="lbl">Estado:</span>
  <button class="state-btn active" data-s="montado">Montado</button>
  <button class="state-btn" data-s="cheio">Cheio</button>
  <button class="state-btn" data-s="vazio">Vazio</button>
</div>

<main id="stage">
  <div id="phone">
    <div id="screen"></div>
    <nav class="tabbar">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Início</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Treino</div>
      <div class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plano</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Estatísticas</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Ajustes</div>
    </nav>
    <div id="sheet-root"><div class="scrim"></div><div class="sheet"></div></div>
    <div id="toast"></div>
  </div>
</main>

<div id="annot-tip"></div>

<div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,0.8);color:white;padding:8px 12px;border-radius:8px;opacity:0.45;transition:opacity 0.2s;display:flex;gap:6px;align-items:center" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.45'">
  <select id="theme-switcher" style="background:#222;color:#fff;border:1px solid #444;border-radius:5px;padding:3px">
    <option value="default">Escuro</option>
    <option value="claro">Claro</option>
  </select>
  <button data-vp="" style="background:#333;color:#fff;border-radius:5px;padding:3px 7px">Celular</button>
  <button data-vp="tablet" style="background:#333;color:#fff;border-radius:5px;padding:3px 7px">Tablet</button>
  <button data-vp="desktop" style="background:#333;color:#fff;border-radius:5px;padding:3px 7px">Desktop</button>
  <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="annot">Anotar</label>
</div>

<script>
/* ---------------- ícones ---------------- */
const I = {
  barbell:'<path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/>',
  pullup:'<path d="M3 4h18M8 4v5a4 4 0 008 0V4M12 13v7M9 20h6"/>',
  legs:'<path d="M9 3v7l-2 11M15 3v7l2 11M9 10h6"/>',
  core:'<rect x="7" y="4" width="10" height="16" rx="4"/><path d="M7 10h10M7 14h10M12 4v16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  up:'<path d="M6 15l6-6 6 6"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
  play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',
  more:'<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>',
  sparkles:'<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'
}
const ic = (n, sw=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`

/* ---------------- dados (plano inicial real, nomes em pt-BR) ---------------- */
const MUSC = {
  chest:{n:'Peito',c:'var(--m-chest)'}, back:{n:'Costas',c:'var(--m-back)'}, legs:{n:'Pernas',c:'var(--m-legs)'},
  shoulders:{n:'Ombros',c:'var(--m-shoulders)'}, arms:{n:'Braços',c:'var(--m-arms)'}, core:{n:'Core',c:'var(--m-core)'}
}
const EX = {
  '0025':['Supino reto com barra','chest'], '0047':['Supino inclinado c/ halteres','chest'], '0426':['Desenvolvimento militar','shoulders'],
  '0334':['Elevação lateral','shoulders'], '0241':['Tríceps na polia','arms'], '0251':['Mergulho nas paralelas','chest'],
  '2330':['Barra fixa','back'], '0027':['Remada curvada','back'], '1323':['Puxada frontal','back'], '0031':['Remada baixa','back'], '0313':['Rosca direta','arms'],
  '0043':['Agachamento livre','legs'], '0085':['Terra romeno','legs'], '0739':['Leg press','legs'], '0585':['Cadeira extensora','legs'], '0586':['Mesa flexora','legs'], '0605':['Panturrilha em pé','legs'],
  'c1':['Prancha','core'], 'c2':['Abdominal na polia','core'], 'c3':['Elevação de pernas','core'],
  'f1':['Face pull','shoulders'], 'f2':['Rosca martelo','arms'], 'f3':['Tríceps francês','arms']
}
const PAL = ['#C2410C','#0a84ff','#30d158','#bf5af2','#40c8e0','#d4a800']
const mk = (id,name,glyph,list) => ({id,name,glyph,ex:list.map(([e,s,r])=>({id:e,sets:s,reps:r}))})
const R_PUSH = () => mk('push','Push Day','barbell',[['0025',4,8],['0047',3,10],['0426',3,10],['0334',3,12],['0241',3,12],['0251',3,10]])
const R_PULL = () => mk('pull','Pull Day','pullup',[['2330',4,10],['0027',4,8],['1323',3,10],['0031',3,10],['0313',3,12]])
const R_LEGS = () => mk('legs','Leg Day','legs',[['0043',4,8],['0085',3,10],['0739',3,12],['0585',3,12],['0586',3,12],['0605',4,15]])
const R_CORE = () => mk('core','Core & Abdômen','core',[['c1',3,'60s'],['c2',3,15],['c3',3,12]])
const R_ARMS = () => mk('arms','Braços + Ombro','barbell',[['f1',3,15],['0313',3,10],['f2',3,12],['0241',3,12],['f3',3,10],['0334',3,15]])
const R_UPPER = () => mk('upper','Upper A','barbell',[['0025',3,8],['2330',3,10],['0047',2,10],['1323',2,10],['0334',2,12],['0241',2,12],['0031',2,12]])

const DAYS = [1,2,3,4,5,6,0]            // semana começa na segunda
const DN = {0:'Dom',1:'Seg',2:'Ter',3:'Qua',4:'Qui',5:'Sex',6:'Sáb'}
const DNL = {0:'Domingo',1:'Segunda-feira',2:'Terça-feira',3:'Quarta-feira',4:'Quinta-feira',5:'Sexta-feira',6:'Sábado'}
const TODAY = 4                         // 24/09/2026 é quinta

const STATES = {
  montado: () => ({ routines:[R_PUSH(),R_PULL(),R_LEGS(),R_CORE()], week:{1:['push'],3:['pull'],5:['legs'],6:['push','core']} }),
  cheio:   () => ({ routines:[R_PUSH(),R_PULL(),R_LEGS(),R_CORE(),R_ARMS(),R_UPPER()], week:{1:['push','core'],2:['pull'],3:['legs','core'],4:['arms'],5:['upper','core'],6:['push','pull']} }),
  vazio:   () => ({ routines:[], week:{} })
}
let S = STATES.montado()
let V = 'd'
let openCard = null

/* ---------------- métricas ---------------- */
const color = r => PAL[S.routines.indexOf(r) % PAL.length]
const byId = id => S.routines.find(r => r.id === id)
const dayR = d => (S.week[d] || []).map(byId).filter(Boolean)
const daysOf = r => DAYS.filter(d => (S.week[d] || []).includes(r.id))
function stat(r) {
  const m = {}; let sets = 0
  r.ex.forEach(e => { sets += e.sets; const g = EX[e.id][1]; m[g] = (m[g] || 0) + e.sets })
  return { ex:r.ex.length, sets, min:Math.round(sets * 2.6 + 4), m }
}
function weekStat() {
  const m = {}; let sets = 0, min = 0, sessions = 0, days = 0
  DAYS.forEach(d => { const rs = dayR(d); if (rs.length) days++
    rs.forEach(r => { const s = stat(r); sessions++; sets += s.sets; min += s.min; for (const g in s.m) m[g] = (m[g] || 0) + s.m[g] }) })
  return { m, sets, min, sessions, days }
}
const fmtMin = n => n >= 60 ? `${Math.floor(n/60)}h${String(n%60).padStart(2,'0')}` : `${n} min`
const mbar = m => { const tot = Object.values(m).reduce((a,b)=>a+b,0) || 1
  return `<div class="mbar">${Object.keys(MUSC).filter(g=>m[g]).map(g=>`<i style="width:${m[g]/tot*100}%;background:${MUSC[g].c}"></i>`).join('')}</div>` }
const legend = m => `<div class="legend">${Object.keys(MUSC).filter(g=>m[g]).map(g=>`<span><b style="background:${MUSC[g].c}"></b>${MUSC[g].n} <span class="mono">${m[g]}</span></span>`).join('')}</div>`
const abbr = n => n.replace(/ Day$/,'').replace(/&.*/,'').trim().slice(0,5)
const glyph = r => `<span class="gly" style="background:color-mix(in srgb,${color(r)} 18%,transparent);color:${color(r)}">${ic(r.glyph)}</span>`

function volPanel() {
  const w = weekStat(), MAX = 24
  const rows = Object.keys(MUSC).map(g => { const n = w.m[g] || 0
    return `<div class="vol-row"><span class="nm">${MUSC[g].n}</span>
      <div class="vol-track"><div class="vol-band" style="left:${10/MAX*100}%;width:${10/MAX*100}%"></div>
      <div class="vol-fill" style="width:${Math.min(n,MAX)/MAX*100}%;background:${MUSC[g].c}"></div></div>
      <span class="n mono ${n<10?'low':''}">${n}</span></div>` }).join('')
  return `<div class="card vol">${rows}<div class="vol-foot">Séries por semana. Faixa tracejada = 10–20 séries (alvo de hipertrofia).</div></div>`
}
const coach = () => `<button class="coach" style="width:100%;text-align:left" onclick="toast('Abriria o Treinador com IA')">
  <span class="gly">${ic('sparkles')}</span><span class="grow"><b>Treinador <em class="ai">IA</em></b><span>Inteligência artificial que monta e revisa seu plano a partir dos seus treinos</span></span>
  <span class="cv">${ic('chev')}</span></button>`
const header = (title='Plano', sub='Sua rotina semanal') => `<div class="hdr"><div><h1>${title}</h1><div class="sub">${sub}</div></div>
  <button class="iconbtn" onclick="toast('Compartilhar plano')" aria-label="Compartilhar">${ic('share')}</button></div>`
const emptyState = () => `<div class="empty"><div class="ico">${ic('clipboard')}</div>Nenhuma rotina ainda.<br>Crie uma ou carregue o plano inicial.
  <br><button class="btn fill" onclick="setState('montado');toast('Plano PPL carregado')">${ic('sparkles')} Carregar plano inicial</button></div>`

/* ---------------- ações ---------------- */
function toggleDay(d, rid) {
  const cur = S.week[d] || []
  const next = cur.includes(rid) ? cur.filter(x => x !== rid) : cur.concat(rid)
  if (next.length) S.week[d] = next; else delete S.week[d]
  render()
}
function move(i, delta) {
  const to = i + delta; if (to < 0 || to >= S.routines.length) return
  const [m] = S.routines.splice(i, 1); S.routines.splice(to, 0, m); render()
}
function newRoutine() {
  const n = S.routines.length + 1
  S.routines.push({ id:'n'+Date.now(), name:'Nova rotina '+n, glyph:'barbell', ex:[] })
  render(); toast('Rotina criada — abriria o editor')
}
function dupRoutine(id) {
  const r = byId(id), i = S.routines.indexOf(r)
  S.routines.splice(i+1, 0, { ...r, id:'d'+Date.now(), name:r.name+' (cópia)', ex:r.ex.map(e=>({...e})) })
  closeSheet(); render(); toast('Rotina duplicada')
}
function delRoutine(id) {
  S.routines = S.routines.filter(r => r.id !== id)
  for (const d in S.week) { S.week[d] = S.week[d].filter(x => x !== id); if (!S.week[d].length) delete S.week[d] }
  closeSheet(); render(); toast('Rotina excluída')
}

/* ---------------- sheet / toast ---------------- */
const root = document.getElementById('sheet-root'), sheetEl = root.querySelector('.sheet')
function openSheet(html) { sheetEl.innerHTML = '<div class="grab"></div>' + html; root.classList.add('open') }
function closeSheet() { root.classList.remove('open') }
root.querySelector('.scrim').onclick = closeSheet
let tt
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600) }

function daySheet(d) {
  const rs = dayR(d), sets = rs.reduce((a,r)=>a+stat(r).sets,0)
  openSheet(`<h3>${DNL[d]}</h3><div class="shsub">${rs.length ? `${rs.length} rotina${rs.length>1?'s':''} · <span class="mono">${sets}</span> séries` : 'Descanso'} — toque para marcar</div>
    ${S.routines.map(r => { const on = (S.week[d]||[]).includes(r.id), s = stat(r)
      return `<button class="opt" onclick="toggleDay(${d},'${r.id}');daySheet(${d})">${glyph(r)}
        <span class="grow"><b style="font-size:14px">${r.name}</b><br><span class="small dim">${s.ex} exercícios · <span class="mono">${s.sets}</span> séries · ~${s.min} min</span></span>
        <span class="check ${on?'on':''}">${on?ic('check',2.5):''}</span></button>` }).join('')}
    <button class="btn fill block" style="margin-top:8px" onclick="closeSheet()">Pronto</button>`)
}
function exList(r) {
  return `<div class="exl">${r.ex.map((e,i)=>`<div class="e"><span class="i mono">${i+1}</span>
    <span class="trunc"><span class="dot" style="background:${MUSC[EX[e.id][1]].c}"></span>${EX[e.id][0]}</span>
    <span class="sr mono">${e.sets} × ${e.reps}</span></div>`).join('') || '<div class="e"><span></span><span class="dim">Sem exercícios</span><span></span></div>'}</div>`
}
function routineSheet(id) {
  const r = byId(id), s = stat(r), i = S.routines.indexOf(r), ds = daysOf(r)
  openSheet(`<div class="row" style="margin-bottom:12px">${glyph(r)}<div class="grow"><h3>${r.name}</h3>
    <div class="small dim">${s.ex} exercícios · <span class="mono">${s.sets}</span> séries · ~${s.min} min · ${ds.length ? ds.map(d=>DN[d]).join(', ') : 'não agendada'}</div></div></div>
    ${mbar(s.m)}${legend(s.m)}<div style="height:12px"></div>${exList(r)}
    <div class="row" style="margin-top:12px;gap:6px">
      <button class="btn fill" style="flex:1" onclick="closeSheet();toast('Iniciaria o treino')">${ic('play')} Iniciar</button>
      <button class="btn tint" style="flex:1" onclick="closeSheet();toast('Abriria o editor')">${ic('edit')} Editar</button>
      <button class="iconbtn" ${i===0?'disabled':''} onclick="move(${i},-1);routineSheet('${id}')" aria-label="Subir">${ic('up')}</button>
      <button class="iconbtn" ${i===S.routines.length-1?'disabled':''} onclick="move(${i},1);routineSheet('${id}')" aria-label="Descer">${ic('down')}</button>
    </div>`)
}
function menuSheet(id) {
  const r = byId(id), i = S.routines.indexOf(r)
  openSheet(`<h3>${r.name}</h3><div class="shsub">Opções da rotina</div>
    <button class="opt" onclick="closeSheet();toast('Abriria o editor')">${ic('edit')} Editar rotina</button>
    <button class="opt" onclick="dupRoutine('${id}')">${ic('copy')} Duplicar</button>
    <button class="opt" ${i===0?'disabled style="opacity:.4"':''} onclick="move(${i},-1);closeSheet()">${ic('up')} Mover para cima</button>
    <button class="opt" ${i===S.routines.length-1?'disabled style="opacity:.4"':''} onclick="move(${i},1);closeSheet()">${ic('down')} Mover para baixo</button>
    <button class="opt danger" onclick="delRoutine('${id}')">${ic('trash')} Excluir rotina</button>`)
}

/* ================= VARIANTE A ================= */
function renderA() {
  const w = weekStat()
  if (!S.routines.length) return header() + coach() + emptyState()
  const strip = DAYS.map(d => { const rs = dayR(d), sets = rs.reduce((a,r)=>a+stat(r).sets,0)
    return `<button class="A-day ${d===TODAY?'today':''}" onclick="daySheet(${d})"><span class="dn">${DN[d]}</span>
      ${rs.length ? `<span class="pills">${rs.map(r=>`<span class="pill" style="background:${color(r)}">${abbr(r.name)}</span>`).join('')}</span><span class="ns mono">${sets} sér</span>` : '<span class="rest">—</span>'}
    </button>` }).join('')
  const cards = S.routines.map(r => { const s = stat(r), ds = daysOf(r)
    return `<div class="card A-card ${openCard===r.id?'open':''}" onclick="openCard=openCard==='${r.id}'?null:'${r.id}';render()">
      <div class="row">${glyph(r)}<div class="grow"><div class="nm trunc">${r.name}</div>
        <div class="st"><b>${s.ex}</b> exercícios · <b>${s.sets}</b> séries · ~<b>${s.min}</b> min</div></div>
        <div class="A-days">${ds.length ? ds.map(d=>`<span class="on">${DN[d]}</span>`).join('') : '<span>—</span>'}</div>
        <span class="chev">${ic('chev')}</span></div>
      ${s.ex ? mbar(s.m) : ''}
      <div class="A-more" onclick="event.stopPropagation()">${legend(s.m)}<div style="height:10px"></div>${exList(r)}
        <div class="A-acts"><button class="btn fill" onclick="toast('Iniciaria o treino')">${ic('play')} Iniciar</button>
          <button class="btn tint" onclick="toast('Abriria o editor')">${ic('edit')} Editar</button>
          <button class="iconbtn" onclick="menuSheet('${r.id}')" aria-label="Mais">${ic('more')}</button></div></div>
    </div>` }).join('')
  return header() + coach() + `<div class="A-cols"><div>
    <div class="sec"><h4>Semana</h4><span class="meta">toque num dia para agendar</span></div>
    <div class="A-strip">${strip}</div>
    <div class="A-kpis"><span><b>${w.days}</b>dias</span><span><b>${w.sessions}</b>treinos</span><span><b>${w.sets}</b>séries</span><span><b>${fmtMin(w.min)}</b></span></div>
    <div class="sec"><h4>Volume semanal</h4></div>${volPanel()}
  </div><div>
    <div class="sec"><h4>Rotinas · ${S.routines.length}</h4><button class="btn tint" onclick="newRoutine()">${ic('plus')} Nova</button></div>
    ${cards}
  </div></div>`
}

/* ================= VARIANTE B ================= */
function renderB() {
  const w = weekStat()
  if (!S.routines.length) return header() + coach() + emptyState()
  const kpis = `<div class="B-kpis">
    <div class="B-kpi"><div class="v">${w.days}<small>/7</small></div><div class="l">dias de treino</div></div>
    <div class="B-kpi"><div class="v">${w.sets}</div><div class="l">séries/semana</div></div>
    <div class="B-kpi"><div class="v">${fmtMin(w.min)}</div><div class="l">tempo estimado</div></div></div>`
  const rows = S.routines.map(r => { const s = stat(r)
    return `<tr><td class="rn" onclick="routineSheet('${r.id}')"><div class="nm"><i style="background:${color(r)}"></i><span class="trunc">${r.name}</span></div>
      <div class="ss"><span class="mono">${s.ex}</span> ex · <span class="mono">${s.sets}</span> sér</div></td>
      ${DAYS.map(d => { const on = (S.week[d]||[]).includes(r.id)
        return `<td><button class="B-cell ${on?'on':''}" style="${on?`background:${color(r)}`:''}" onclick="toggleDay(${d},'${r.id}')" aria-label="${r.name} na ${DNL[d]}">${on?ic('check',2.6):''}</button></td>` }).join('')}</tr>` }).join('')
  const foot = DAYS.map(d => { const n = dayR(d).reduce((a,r)=>a+stat(r).sets,0); return `<td class="${n?'hi':''}">${n||'·'}</td>` }).join('')
  const mx = `<div class="card B-mx"><table>
    <thead><tr><th>Rotina</th>${DAYS.map(d=>`<th class="${d===TODAY?'today':''}">${DN[d].slice(0,3)}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td>Séries/dia</td>${foot}</tr></tfoot></table>
    <button class="B-add" onclick="newRoutine()">${ic('plus')} Nova rotina</button></div>
    <div class="B-hint">Toque numa célula para agendar · toque no nome para ver exercícios, iniciar ou reordenar</div>`
  return header() + coach() + `<div class="sec"><h4>Resumo da semana</h4></div>${kpis}
    <div class="B-cols"><div><div class="sec"><h4>Rotinas × dias</h4><span class="meta">${S.routines.length} rotinas</span></div>${mx}</div>
    <div><div class="sec"><h4>Volume por músculo</h4></div>${volPanel()}</div></div>`
}

/* ================= VARIANTE C ================= */
function renderC() {
  if (!S.routines.length) return header() + coach() + emptyState()
  const week = `<div class="C-week">${DAYS.map(d => { const rs = dayR(d)
    const bg = rs.length === 1 ? color(rs[0]) : rs.length > 1 ? `conic-gradient(${rs.map((r,i)=>`${color(r)} ${i/rs.length*360}deg ${(i+1)/rs.length*360}deg`).join(',')})` : ''
    return `<button class="C-wd ${d===TODAY?'today':''}" onclick="daySheet(${d})"><span class="dn">${DN[d][0]}</span>
      <span class="dt ${rs.length?'':'rest'} ${rs.length>1?'multi':''}" style="${bg?`background:${bg}`:''}">${rs.length ? (rs.length>1 ? rs.length+'×' : abbr(rs[0].name).slice(0,2)) : '·'}</span></button>` }).join('')}</div>`
  const cards = S.routines.map(r => { const s = stat(r), preview = r.ex.map(e=>EX[e.id][0]).join(', ')
    return `<div class="card C-card"><div class="t">${glyph(r)}<div class="grow" style="cursor:pointer" onclick="routineSheet('${r.id}')">
      <div class="nm">${r.name}</div><div class="pv">${preview || 'Sem exercícios ainda'}</div></div>
      <button class="iconbtn sm" style="background:none;color:var(--color-text-muted)" onclick="menuSheet('${r.id}')" aria-label="Mais">${ic('more')}</button></div>
      <div class="C-stats"><span><b>${s.ex}</b> exercícios</span><span><b>${s.sets}</b> séries</span><span>~<b>${s.min}</b> min</span></div>
      ${s.ex ? `<div style="margin-top:10px">${mbar(s.m)}</div>` : ''}
      <div class="C-dayrow">${DAYS.map(d => { const on = (S.week[d]||[]).includes(r.id)
        return `<button class="C-dp ${on?'on':''}" style="${on?`background:${color(r)}`:''}" onclick="toggleDay(${d},'${r.id}')">${DN[d][0]}</button>` }).join('')}</div>
      <button class="btn fill block" onclick="toast('Iniciaria ${r.name}')">${ic('play')} Iniciar rotina</button></div>` }).join('')
  return header() + `<div class="sec" style="margin-top:4px"><h4>Esta semana</h4><span class="meta">${weekStat().sets} séries · ${fmtMin(weekStat().min)}</span></div>${week}
    <div class="C-top"><button class="btn tint" onclick="newRoutine()">${ic('plus')} Nova rotina</button>
      <button class="btn tint" onclick="toast('Abriria os planos prontos')">${ic('compass')} Planos prontos</button></div>
    <div style="margin-top:12px">${coach()}</div>
    <div class="sec"><h4>Minhas rotinas · ${S.routines.length}</h4></div><div class="C-grid">${cards}</div>`
}

/* ================= RODADA 2 ================= */
const sgly = r => `<span class="sgly">${ic(r.glyph)}</span>`
const meta = r => { const s = stat(r); return s.ex ? `${s.ex} exercícios · <span class="mono">${s.sets}</span> séries · ~${s.min} min` : 'Sem exercícios' }
const summary = () => { const w = weekStat()
  return `<div class="sumline"><b>${w.days}</b> dias de treino · <b>${w.sets}</b> séries · <b>${fmtMin(w.min)}</b> por semana</div>` }
const newBtn = () => `<button class="btn tint" onclick="newRoutine()">${ic('plus')} Nova</button>`

/* D — lista limpa: um dia por linha, uma rotina por linha */
function renderD() {
  if (!S.routines.length) return header() + emptyState()
  const days = DAYS.map(d => { const rs = dayR(d)
    return `<button class="D-day ${d===TODAY?'today':''}" onclick="daySheet(${d})"><span class="dn">${DN[d]}</span>
      <span class="rn trunc ${rs.length?'':'rest'}">${rs.length ? rs.map(r=>r.name).join(' + ') : 'Descanso'}</span>
      <span class="cv">${ic('chev')}</span></button>` }).join('')
  const list = S.routines.map(r => `<button class="li" onclick="routineSheet('${r.id}')">${sgly(r)}
    <span class="grow"><div class="t1 trunc">${r.name}</div><div class="t2">${meta(r)}</div></span><span class="cv">${ic('chev')}</span></button>`).join('')
  return header() + coach() + `<div class="D-cols"><div>
    <div class="sec"><h4>Semana</h4></div><div class="lst">${days}</div>${summary()}
  </div><div>
    <div class="sec"><h4>Rotinas</h4>${newBtn()}</div><div class="lst">${list}</div>
  </div></div>`
}

/* E — próximo treino em destaque, semana numa linha de pontos */
function nextWorkout() {
  for (let k = 0; k < 7; k++) { const d = (TODAY + k) % 7, rs = dayR(d); if (rs.length) return { d, k, rs } }
  return null
}
function renderE() {
  if (!S.routines.length) return header() + emptyState()
  const nx = nextWorkout()
  const when = nx ? (nx.k === 0 ? 'Hoje' : nx.k === 1 ? 'Amanhã · ' + DNL[nx.d] : DNL[nx.d]) : ''
  const next = nx ? `<div class="E-next"><div class="k">${when}</div>
      <div class="n">${nx.rs.map(r=>r.name).join(' + ')}</div><div class="m">${nx.rs.map(meta).join(' · ')}</div>
      <button class="btn fill block" onclick="toast('Iniciaria o treino')">${ic('play')} Iniciar</button></div>`
    : `<div class="E-next"><div class="k">Nenhum dia agendado</div><div class="m">Toque num dia abaixo para agendar.</div></div>`
  const strip = `<div class="E-strip">${DAYS.map(d => `<button class="E-d ${dayR(d).length?'on':''} ${d===TODAY?'today':''}" onclick="daySheet(${d})">
    <span class="dn">${DN[d][0]}</span><span class="dot"></span></button>`).join('')}</div>`
  const list = S.routines.map(r => { const ds = daysOf(r)
    return `<button class="li" onclick="routineSheet('${r.id}')">${sgly(r)}
      <span class="grow"><div class="t1 trunc">${r.name}</div><div class="t2">${meta(r)}</div></span>
      <span class="E-tag ${ds.length?'on':''}">${ds.length ? ds.map(d=>DN[d]).join(' · ') : '—'}</span><span class="cv">${ic('chev')}</span></button>` }).join('')
  return header() + coach() + `<div class="E-cols"><div><div class="sec"><h4>Próximo treino</h4></div>${next}${strip}${summary()}</div><div>
    <div class="sec"><h4>Rotinas</h4>${newBtn()}</div><div class="lst">${list}</div></div></div>`
}

/* F — só rotinas: a semana é derivada dos dias marcados em cada rotina */
function renderF() {
  if (!S.routines.length) return header() + emptyState()
  const rows = S.routines.map(r => `<div class="F-row">
    <div class="F-top" onclick="routineSheet('${r.id}')">${sgly(r)}<span class="grow"><div class="t1 trunc">${r.name}</div><div class="t2">${meta(r)}</div></span>
      <button class="iconbtn sm" style="background:none;color:var(--color-text-muted)" onclick="event.stopPropagation();menuSheet('${r.id}')" aria-label="Mais">${ic('more')}</button></div>
    <div class="F-days">${DAYS.map(d => { const on = (S.week[d]||[]).includes(r.id)
      return `<button class="F-dp ${on?'on':''} ${d===TODAY?'today':''}" onclick="toggleDay(${d},'${r.id}')" aria-label="${r.name} na ${DNL[d]}">${DN[d][0]}</button>` }).join('')}</div>
  </div>`).join('')
  return header() + coach() + `<div class="F-wrap"><div class="sec"><h4>Rotinas</h4></div>
    <div class="lst">${rows}<button class="F-new" onclick="newRoutine()">${ic('plus')} Nova rotina</button></div>${summary()}
    <div class="sumline faint">Marque os dias direto em cada rotina.</div></div>`
}

/* ---------------- render + controles ---------------- */
const screen = document.getElementById('screen')
function render() {
  const top = screen.scrollTop
  screen.innerHTML = '<div class="inner">' + ({a:renderA,b:renderB,c:renderC,d:renderD,e:renderE,f:renderF})[V]() + '</div>'
  screen.scrollTop = top
}
function setState(s) {
  S = STATES[s](); openCard = null
  document.querySelectorAll('.state-btn').forEach(b => b.classList.toggle('active', b.dataset.s === s)); render()
}
function showVariant(v) {
  V = v; closeSheet(); screen.scrollTop = 0
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.v === v)); render()
}
document.querySelectorAll('.variant-tab').forEach(t => t.onclick = () => showVariant(t.dataset.v))
document.querySelectorAll('.state-btn').forEach(b => b.onclick = () => setState(b.dataset.s))
document.querySelectorAll('[data-vp]').forEach(b => b.onclick = () => { document.getElementById('phone').className = b.dataset.vp })
document.getElementById('theme-switcher').onchange = e => { document.querySelector('link[href*=themes]').href = '../themes/' + e.target.value + '.css' }

/* anotação: mostra fonte, cor e espaçamento do elemento sob o mouse */
const tip = document.getElementById('annot-tip')
document.getElementById('annot').onchange = e => { document.body.classList.toggle('annot', e.target.checked); if (!e.target.checked) tip.style.display = 'none' }
screen.addEventListener('mousemove', e => {
  if (!document.body.classList.contains('annot')) return
  const cs = getComputedStyle(e.target)
  tip.textContent = `${e.target.tagName.toLowerCase()}.${[...e.target.classList].join('.')}\nfont ${cs.fontSize} / ${cs.fontWeight}\ncolor ${cs.color}\nbg ${cs.backgroundColor}\npad ${cs.padding}`
  tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'
})
render()
</script>
</body>
</html>
